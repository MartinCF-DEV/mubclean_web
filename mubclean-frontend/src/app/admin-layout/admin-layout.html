<div class="admin-layout" [class.sidebar-collapsed]="isCollapsed">

    <!-- Sidebar -->
    <aside class="sidebar" [class.mobile-open]="isSidebarOpen">
        <!-- Logo Area -->
        <div class="sidebar-header">
            <div class="logo-area" *ngIf="!isCollapsed">
                <img src="assets/logoexpandido.png" alt="MubClean" class="logo-full"
                    style="max-height: 40px; margin-left: 10px;">
            </div>
            <div class="logo-icon-only" *ngIf="isCollapsed">
                <img src="logo.png" alt="M" class="logo-mini">
            </div>

            <!-- Collapse Toggle (Desktop) -->
            <button class="collapse-btn" (click)="toggleCollapse()">
                <span class="material-icons">{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</span>
            </button>

            <!-- Close (Mobile) -->
            <button class="mobile-close-btn" (click)="toggleSidebarMobile()">
                <span class="material-icons">close</span>
            </button>
        </div>

        <!-- Quick Action Button -->
        <div style="padding: 0 16px 16px; text-align: center;">
            <button (click)="openQuickReserve()"
                style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s;">
                <span class="material-icons">add_box</span>
                <span *ngIf="!isCollapsed">Nueva Reserva</span>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item" title="Inicio">
                <span class="material-icons">dashboard</span>
                <span class="label" *ngIf="!isCollapsed">Inicio</span>
            </a>
            <a routerLink="/admin/employees" routerLinkActive="active" class="nav-item" title="Empleados">
                <span class="material-icons">groups</span>
                <span class="label" *ngIf="!isCollapsed">Empleados</span>
            </a>
            <a routerLink="/admin/support" routerLinkActive="active" class="nav-item" title="Soporte">
                <span class="material-icons">support_agent</span>
                <span class="label" *ngIf="!isCollapsed">Soporte</span>
            </a>
            <!-- Solicitudes -->
            <a routerLink="/admin/requests" routerLinkActive="active" class="nav-item" title="Solicitudes">
                <span class="material-icons">assignment</span>
                <span class="label" *ngIf="!isCollapsed">Solicitudes</span>
            </a>
            <!-- Catálogo -->
            <a routerLink="/admin/services" routerLinkActive="active" class="nav-item" title="Catálogo">
                <span class="material-icons">view_list</span> <!-- o category / view_list_rounded -->
                <span class="label" *ngIf="!isCollapsed">Catálogo</span>
            </a>
            <!-- Métricas -->
            <a routerLink="/admin/metrics" routerLinkActive="active" class="nav-item" title="Métricas">
                <span class="material-icons">bar_chart</span>
                <span class="label" *ngIf="!isCollapsed">Métricas</span>
            </a>
            <!-- Perfil en el sidebar (como pidió el usuario) -->
            <a routerLink="/admin/profile" routerLinkActive="active" class="nav-item" title="Mi Perfil">
                <span class="material-icons">person</span>
                <span class="label" *ngIf="!isCollapsed">Mi Perfil</span>
            </a>
        </nav>

        <!-- User/Logout Footer -->
        <div class="sidebar-footer">
            <div class="user-info" *ngIf="!isCollapsed && currentUser">
                <div class="user-avatar">
                    <span>{{ currentUser.email?.[0] | uppercase }}</span>
                </div>
                <div class="user-details">
                    <span class="user-email" style="font-weight: 600;">{{ currentUser.email }}</span>
                    <div style="display: flex; align-items: center; gap: 4px; margin-top: 4px;">
                        <span class="material-icons" style="font-size: 14px; color: #10b981;">verified</span>
                        <span style="font-size: 11px; color: #10b981; font-weight: 700;">Licencia Activa</span>
                    </div>
                </div>
            </div>

            <button class="logout-btn" (click)="logout()" title="Cerrar Sesión">
                <span class="material-icons">logout</span>
                <span class="label" *ngIf="!isCollapsed">Salir</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="mobile-topbar">
            <button class="menu-btn" (click)="toggleSidebarMobile()">
                <span class="material-icons">menu</span>
            </button>
            <span class="mobile-title">Admin Panel</span>
        </header>

        <div class="content-scroll">
            <router-outlet></router-outlet>
        </div>
    </main>

    <!-- Overlay -->
    <div class="overlay" *ngIf="isSidebarOpen" (click)="toggleSidebarMobile()"></div>

    <!-- Quick Reserve Modal -->
    <div class="modal-overlay" *ngIf="showQuickReserve"
        style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div class="modal"
            style="background: white; padding: 32px; border-radius: 24px; width: 90%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
            <h2 style="margin-top: 0; font-family: 'Fraunces', serif; font-size: 24px; color: #0f172a;">Reserva Rápida
            </h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 24px;">Agenda un cliente en llamada al instante.
            </p>

            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label
                        style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block;">Nombre
                        del Cliente *</label>
                    <input type="text" [(ngModel)]="qrName" placeholder="Ej. Juan Pérez"
                        style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;" />
                </div>
                <div>
                    <label
                        style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block;">Teléfono
                        *</label>
                    <input type="tel" [(ngModel)]="qrPhone" placeholder="10 dígitos"
                        style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;" />
                </div>
                <div>
                    <label
                        style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block;">Dirección
                        del Servicio *</label>
                    <input type="text" [(ngModel)]="qrAddress" placeholder="Calle, Colonia, C.P."
                        style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;" />
                </div>
                <div>
                    <label
                        style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block;">Servicio
                        Solicitado</label>
                    <input type="text" [(ngModel)]="qrService" placeholder="Ej. Limpieza Profunda"
                        style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;" />
                </div>
                <div>
                    <label
                        style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block;">Total
                        a Cobrar ($)</label>
                    <input type="number" [(ngModel)]="qrTotal" placeholder="0.00"
                        style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;" />
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                <button (click)="closeQuickReserve()"
                    style="padding: 10px 20px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; color: #64748b; font-weight: 600; cursor: pointer;">Cancelar</button>
                <button (click)="submitQuickReserve()" [disabled]="isSubmittingQR || !qrName || !qrPhone || !qrAddress"
                    style="padding: 10px 20px; border-radius: 8px; border: none; background: #1565c0; color: white; font-weight: 600; cursor: pointer;">
                    {{ isSubmittingQR ? 'Guardando...' : 'Crear Reserva' }}
                </button>
            </div>
        </div>
    </div>
</div>
